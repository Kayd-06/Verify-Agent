<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity Dashboard</title>
  <link rel="icon" type="image/jpeg" href="../landing/assets/favicon.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Brand Colors and Fonts - Strict Constraints */
    :root {
      --bg: #0A0D12;
      --panel: #12161D;
      --line: #232933;
      --text: #E8EAED;
      --muted: #7C8697;
      --cyan: #5EEAD4;
      --coral: #FF6B57;
      --amber: #F5B942;
      --font-serif: 'Fraunces', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono); 
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      font-weight: 400;
      margin: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 50px 24px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 24px;
    }

    .brand {
      font-size: 2.2rem;
      letter-spacing: 0.05em;
    }
    .brand span {
      color: var(--cyan);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(94,234,212,0.08);
      border: 1px solid rgba(94,234,212,0.2);
      color: var(--cyan);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1rem;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 60px;
    }
    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .kpi-value {
      font-family: var(--font-serif);
      font-size: 3.5rem;
      margin-bottom: 12px;
      line-height: 1;
    }
    .kpi-label {
      color: var(--muted);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .text-cyan { color: var(--cyan); }
    .text-coral { color: var(--coral); }
    .text-amber { color: var(--amber); }

    /* Main Columns */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }

    .col-header {
      font-size: 1.8rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Activity Cards */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(124, 134, 151, 0.1);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-time {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .card-title {
      font-size: 1.25rem;
      color: var(--text);
      line-height: 1.4;
    }

    .card-desc {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .status-pass { color: var(--cyan); }
    .status-fail { color: var(--coral); }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--muted);
      background: var(--panel);
      border-radius: 16px;
      border: 1px dashed var(--line);
      font-size: 1.1rem;
    }

    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">VER<span>I</span>TY</div>
    <div class="status-badge" id="conn-status">
      <div class="status-dot"></div>
      System Active
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-value text-cyan" id="kpi-tasks">0</div>
      <div class="kpi-label">Tasks Handled</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value text-cyan" id="kpi-pass">100%</div>
      <div class="kpi-label">Quality Score</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value text-coral" id="kpi-fail">0</div>
      <div class="kpi-label">Errors Prevented</div>
    </div>
  </div>

  <div class="columns">
    <!-- Left Column: What AI did -->
    <div>
      <h2 class="col-header">
        Recent Activity
        <span id="count-worker" style="font-size:1.1rem; color:var(--muted)">0</span>
      </h2>
      <div class="list" id="worker-list">
        <div class="empty-state">Waiting for the AI to perform tasks...</div>
      </div>
    </div>
    
    <!-- Right Column: Verification Results -->
    <div>
      <h2 class="col-header">
        Quality Control
        <span id="count-verifier" style="font-size:1.1rem; color:var(--muted)">0</span>
      </h2>
      <div class="list" id="verifier-list">
        <div class="empty-state">Waiting for quality checks...</div>
      </div>
    </div>
  </div>
</div>

<script>
// Format date to readable time
function fmt(iso) {
  if(!iso) return 'Just now';
  try { return new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); } catch{return iso;}
}

// Clean up ugly API names (e.g. create_ticket -> Create Ticket)
function cleanName(str) {
  if (!str) return 'Action';
  return str.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

// Render data into the DOM
function render(actions, verdicts) {
  const wList = document.getElementById('worker-list');
  const vList = document.getElementById('verifier-list');
  
  document.getElementById('count-worker').textContent = actions.length;
  document.getElementById('count-verifier').textContent = verdicts.length;

  const passes = verdicts.filter(v => v.result === 'PASS').length;
  const fails = verdicts.filter(v => v.result === 'FAIL').length;
  
  document.getElementById('kpi-tasks').textContent = actions.length;
  document.getElementById('kpi-fail').textContent = fails;
  document.getElementById('kpi-pass').textContent = verdicts.length ? Math.round((passes / verdicts.length) * 100) + '%' : '100%';

  if (actions.length) {
    wList.innerHTML = [...actions].reverse().map(a => {
      const summary = a.claimed_state?.summary || a.claimed_result?.summary || 'Processed automatically.';
      return `
        <div class="card">
          <div class="card-top">
            <div class="app-badge">${a.target_app || 'System'}</div>
            <div class="card-time">${fmt(a.timestamp)}</div>
          </div>
          <div class="card-title">${cleanName(a.action_type)}</div>
          <div class="card-desc">${summary}</div>
        </div>
      `;
    }).join('');
  }

  if (verdicts.length) {
    vList.innerHTML = [...verdicts].reverse().map(v => {
      const isPass = (v.result || '').toLowerCase() === 'pass';
      const colorCls = isPass ? 'status-pass' : 'status-fail';
      const title = isPass ? 'Verified Successfully' : 'Error Caught';
      let details = isPass ? 'All checks passed. The AI performed the correct action.' : ('Issue found: ' + cleanName(v.failure_category));
      
      if (!isPass && v.diffs && v.diffs.length > 0) {
        details += '<br><br><span style="color:var(--coral)">' + v.diffs.join('<br>') + '</span>';
      }

      return `
        <div class="card" style="border-left: 4px solid var(--${isPass ? 'cyan' : 'coral'})">
          <div class="card-top">
            <div class="app-badge" style="background:transparent; padding:0; font-weight:bold; color:var(--${isPass ? 'cyan' : 'coral'})">
              ${isPass ? 'APPROVED' : 'BLOCKED'}
            </div>
            <div class="card-time">${fmt(v.verified_at)}</div>
          </div>
          <div class="card-title ${colorCls}">${title}</div>
          <div class="card-desc">${details}</div>
        </div>
      `;
    }).join('');
  }
}

// Fetch loop
async function refresh() {
  const statusEl = document.getElementById('conn-status');
  try {
    const [resA, resV] = await Promise.all([
      fetch('/api/actions'),
      fetch('/api/verifications')
    ]);
    if (!resA.ok || !resV.ok) throw new Error("Network error");
    
    const actions = await resA.json();
    const verdicts = await resV.json();
    
    statusEl.innerHTML = '<div class="status-dot"></div> System Active';
    statusEl.style.color = 'var(--cyan)';
    statusEl.style.borderColor = 'rgba(94,234,212,0.2)';
    
    render(actions || [], verdicts || []);
  } catch (e) {
    statusEl.innerHTML = 'Connecting...';
    statusEl.style.color = 'var(--coral)';
    statusEl.style.borderColor = 'rgba(255,107,87,0.2)';
  }
}

refresh();
setInterval(refresh, 4000);
</script>

</body>
</html>
